<div class="pending-users-page">
    <div style="margin-bottom: 24px;">
        <h2 style="color: var(--header-primary); margin-bottom: 8px;">Заявки на доступ</h2>
        <p style="color: var(--text-muted); margin: 0;">Управление заявками новых пользователей</p>
    </div>

    <!-- Статистика — общий компонент .stat-strip/.stat-chip (см. dashboard.html
         и "MODAL COMPONENT" по соседству в global-styles.css), а не свой
         div с зашитыми паддингами/радиусами. -->
    <div class="stat-strip" id="pending-stats" style="display: none;">
        <div class="stat-chip">
            <div class="stat-chip-icon">⏳</div>
            <div class="stat-chip-body">
                <div class="stat-chip-value"><span id="pending-count">0</span></div>
                <div class="stat-chip-label">Ожидают подтверждения</div>
            </div>
        </div>
    </div>

    <!-- Таблица заявок -->
    <div id="pending-table-container">
        <div id="pending-loading" style="text-align: center; padding: 40px;">
            <div class="skeleton" style="height: 200px;"></div>
        </div>
        <div id="pending-empty" class="empty-state" style="display: none;">
            <i class="fas fa-circle-check"></i>
            <h3>Нет ожидающих заявок</h3>
            <p>Все заявки обработаны</p>
        </div>
        <!-- .table-cards — раскладка "карточка на строку" с компактными
             кнопками (см. "TABLE CARDS" в global-styles.css), та же, что у
             вкладок "Пользователи" и "Серверы": широкая таблица с крупными
             кнопками не влезала в экран телефона. Подписи — data-label на
             <td> (renderPendingUsers в spa-router.js). -->
        <div id="pending-table" class="table-container table-cards" style="display: none;">
            <table>
                <thead>
                    <tr>
                        <th>Имя</th>
                        <th>Логин</th>
                        <th>Дата заявки</th>
                        <th class="text-right">Действия</th>
                    </tr>
                </thead>
                <tbody id="pending-tbody">
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Модальное окно подтверждения — общий компонент модалки, см. "MODAL
     COMPONENT" в global-styles.css. -->
<div id="approve-modal" class="modal-overlay" style="display: none;">
    <div class="modal-box">
        <div class="modal-header">
            <h3>Подтвердить заявку?</h3>
        </div>
        <div class="modal-body">
            <p class="modal-hint" id="approve-modal-text">Пользователь получит полный доступ к админ-панели.</p>
        </div>
        <div class="modal-footer">
            <button id="approve-cancel-btn" class="btn btn-secondary">Отмена</button>
            <button id="approve-confirm-btn" class="btn btn-success">Подтвердить</button>
        </div>
    </div>
</div>

<!-- Модальное окно отклонения -->
<div id="reject-modal" class="modal-overlay" style="display: none;">
    <div class="modal-box">
        <div class="modal-header">
            <h3>Отклонить заявку?</h3>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label class="form-label" for="reject-reason">Причина отклонения (необязательно)</label>
                <input type="text" id="reject-reason" class="form-input" placeholder="Нарушение правил, спам и т.д.">
            </div>
        </div>
        <div class="modal-footer">
            <button id="reject-cancel-btn" class="btn btn-secondary">Отмена</button>
            <button id="reject-confirm-btn" class="btn btn-danger">Отклонить</button>
        </div>
    </div>
</div>

<!-- Toast уведомления — общий компонент .toast-container/.toast, см.
     "TOAST COMPONENT" в global-styles.css. -->
<div id="pending-toast-container" class="toast-container"></div>
