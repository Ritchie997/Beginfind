<div class="stats-grid">
    <div class="stat-card">
        <div class="stat-label">Всего статей</div>
        <div class="stat-value" id="total-articles">0</div>
        <div class="stat-label">статей</div>
    </div>

    <div class="stat-card">
        <div class="stat-label">Всего серверов</div>
        <div class="stat-value" id="total-servers">0</div>
        <div class="stat-label">серверов</div>
    </div>

    <div class="stat-card">
        <div class="stat-label">Всего сообщений</div>
        <div class="stat-value" id="total-messages">0</div>
        <div class="stat-label">сообщений</div>
    </div>

    <div class="stat-card">
        <div class="stat-label">Всего категорий</div>
        <div class="stat-value" id="total-categories">0</div>
        <div class="stat-label">категорий</div>
    </div>
</div>

<!-- Charts container -->
<div class="charts-container">
    <div class="chart-card">
        <h3 class="chart-title">Активность за неделю</h3>
        <canvas id="weeklyActivityChart"></canvas>
    </div>

    <div class="chart-card">
        <div class="graph-page-header">
            <h3 class="chart-title" style="margin-bottom: 0;">Граф связей статей</h3>
            <span id="graphNodeCount" class="graph-page-count"></span>
        </div>
        <div class="graph-controls">
            <select id="graphServerFilter" class="form-select graph-controls-select">
                <option value="">Все серверы</option>
            </select>
            <div class="graph-search-wrap">
                <i class="fas fa-search"></i>
                <input type="text" id="graphSearchInput" class="form-input" placeholder="Поиск по названию статьи…">
                <button type="button" id="graphSearchClear" class="graph-search-clear" title="Очистить поиск" hidden>&times;</button>
            </div>
            <label class="graph-controls-checkbox">
                <input type="checkbox" id="graphHideIsolated">
                Скрыть изолированные
            </label>
            <button type="button" id="graphExportPng" class="btn btn-secondary btn-sm graph-controls-export">
                <i class="fas fa-download"></i> PNG
            </button>
        </div>
        <div class="graph-container graph-container-dashboard" id="graphContainer">
            <div class="graph-empty">Загрузка графа…</div>
        </div>
    </div>
</div>

<div class="activity-container">
    <h2 class="activity-title">Последняя активность</h2>
    <ul class="activity-list" id="activity-list">
        <li class="activity-item">
            <div class="activity-header">
                <span class="activity-title-text">Система запущена</span>
                <span class="activity-time">Только что</span>
            </div>
            <div class="activity-description">Сервер успешно запущен и работает</div>
        </li>
    </ul>
</div>
