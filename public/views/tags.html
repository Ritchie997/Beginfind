<!-- Вкладка "Теги": глобальный список всех тегов, существующих в системе, без
     дублей (регистр и ведущий "#" не различаются). Заменила прежнюю вкладку
     "Категории" — сущности "Категория" в проекте больше нет. Список только для
     чтения: теги создаются и правятся в самих статьях (поле "Теги" в
     редакторе или #тег прямо в тексте), см. GET /api/tags. -->
<div class="tags-page">

  <div class="tags-toolbar">
    <div class="tags-toolbar-row">
      <h2 class="tags-heading"><i class="fas fa-tags"></i> Теги</h2>
      <div class="tags-search-wrap">
        <i class="fas fa-search"></i>
        <input type="text" id="tagsSearchInput" class="tags-search-input" placeholder="Поиск">
      </div>
    </div>
    <div class="tags-toolbar-row tags-toolbar-row-status">
      <span class="tags-count" id="tagsCount"></span>
    </div>
  </div>

  <div class="tags-loading" id="tagsLoading">
    <div class="tags-skeleton-card"></div>
    <div class="tags-skeleton-card"></div>
    <div class="tags-skeleton-card"></div>
  </div>

  <div class="tags-empty" id="tagsEmpty" hidden>
    <i class="fas fa-tags"></i>
    <h3 id="tagsEmptyTitle">Пока нет ни одного тега</h3>
    <p id="tagsEmptyText">Теги появляются, когда вы добавляете их к статье в редакторе (поле «Теги») или пишете #тег прямо в тексте.</p>
  </div>

  <div class="tags-grid" id="tagsContainer" hidden></div>

  <!-- Смена цвета тега — тот же язык модалок, что у вкладки "Сервера" (см.
       .modal-overlay/.modal-box/.modal-header/.modal-body/.modal-footer в
       global-styles.css и, например, #server-role-editor-modal в
       servers.html): те же классы, тот же порядок блоков — на телефоне и на
       ПК ведёт себя одинаково с остальными модалками сайта. Основной способ
       выбора цвета — нативный <input type="color">; HEX-поле — уточнение
       рядом, синхронизируется с ним в обе стороны (см. showTagColorModal/
       setTagColorModalValue в spa-router.js). -->
  <div id="tag-color-modal" class="modal-overlay" hidden>
    <div class="modal-box">
      <div class="modal-header">
        <h3>Цвет тега</h3>
        <button type="button" class="modal-close" id="tag-color-modal-close-btn" title="Закрыть">&times;</button>
      </div>
      <div class="modal-body">
        <div class="tag-color-modal-preview">
          <span class="tag-card-icon tag-color-modal-icon" id="tag-color-modal-icon"><i class="fas fa-hashtag"></i></span>
          <span class="tag-color-modal-name" id="tag-color-modal-name"></span>
        </div>
        <div class="tag-color-modal-picker-row">
          <input type="color" id="tag-color-modal-picker" class="tag-color-modal-picker" aria-label="Выбор цвета">
          <div class="tag-color-modal-hex-wrap">
            <label class="form-label" for="tag-color-modal-hex">HEX-код</label>
            <input type="text" id="tag-color-modal-hex" class="form-input tag-color-modal-hex" maxlength="7" placeholder="#5865F2" autocomplete="off" spellcheck="false">
          </div>
        </div>
        <div class="tag-color-modal-presets" id="tag-color-modal-presets"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="tag-color-modal-cancel-btn">Отмена</button>
        <button class="btn btn-primary" id="tag-color-modal-save-btn">Сохранить</button>
      </div>
    </div>
  </div>
</div>

<style>
/* === TAGS PAGE — тот же язык дизайна, что у вкладок "Сервера"/"Пользователи":
   тулбар-карточка, компактные плитки. === */

.tags-page { padding: 0; }

/* [hidden] должен реально прятать элементы страницы — .tags-loading{display:grid}
   и .tags-grid{display:grid} с той же специфичностью иначе побеждали бы его. */
.tags-page [hidden] { display: none !important; }

.tags-toolbar {
  background: var(--background-secondary);
  border: 1px solid var(--background-accent);
  border-radius: 10px;
  padding: 16px 18px;
  margin-bottom: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.tags-toolbar-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.tags-toolbar-row-status {
  justify-content: space-between;
  padding-top: 10px;
  border-top: 1px solid var(--background-accent);
}

.tags-heading {
  margin: 0;
  font-size: 20px;
  font-weight: 700;
  color: var(--text-normal);
  display: flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
}
.tags-heading i { color: var(--blurple); }

.tags-search-wrap {
  flex: 1 1 220px;
  min-width: 160px;
  position: relative;
  display: flex;
  align-items: center;
}
.tags-search-wrap i {
  position: absolute;
  left: 12px;
  color: var(--text-muted);
  font-size: 13px;
  pointer-events: none;
}
.tags-search-input {
  width: 100%;
  padding: 10px 12px 10px 34px;
  border: 1px solid var(--background-accent);
  border-radius: 6px;
  background: var(--background-tertiary);
  color: var(--text-normal);
  font-size: 14px;
}
.tags-search-input:focus {
  outline: none;
  border-color: var(--blurple);
  box-shadow: 0 0 0 2px rgba(88, 101, 242, 0.2);
}

.tags-count { font-size: 13px; color: var(--header-secondary); }

.tags-loading {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 180px), 1fr));
  gap: 10px;
}
.tags-skeleton-card {
  height: 56px;
  border-radius: 8px;
  background: linear-gradient(90deg, var(--background-secondary) 25%, var(--background-tertiary) 37%, var(--background-secondary) 63%);
  background-size: 400% 100%;
  animation: tags-skeleton-shimmer 1.4s ease infinite;
  border: 1px solid var(--background-accent);
}
@keyframes tags-skeleton-shimmer {
  0% { background-position: 100% 50%; }
  100% { background-position: 0 50%; }
}

.tags-empty {
  text-align: center;
  padding: 40px 16px;
  color: var(--text-muted);
  background: var(--background-secondary);
  border: 1px dashed var(--background-accent);
  border-radius: 10px;
}
.tags-empty i { font-size: 40px; color: var(--blurple); margin-bottom: 12px; display: block; }
.tags-empty h3 { color: var(--text-normal); margin: 0 0 8px; }
.tags-empty p { max-width: 480px; margin: 0 auto; line-height: 1.5; font-size: 13px; }

.tags-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 180px), 1fr));
  gap: 10px;
}

.tag-card {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--background-secondary);
  border: 1px solid var(--background-accent);
  border-radius: 8px;
  padding: 4px 8px 4px 4px;
  transition: border-color 0.15s, transform 0.15s;
}
@media (hover: hover) {
  .tag-card:hover { border-color: var(--blurple); transform: translateY(-1px); }
}
.tag-card-main {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 1;
  min-width: 0;
  text-align: left;
  background: none;
  border: none;
  padding: 6px 6px;
  color: var(--text-normal);
  font: inherit;
  cursor: pointer;
}
.tag-card-icon {
  flex: 0 0 auto;
  width: 30px;
  height: 30px;
  border-radius: 8px;
  background: rgba(88, 101, 242, 0.15);
  color: var(--blurple);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
}
.tag-card-body { min-width: 0; flex: 1; }
.tag-card-name,
.tag-card-meta { display: block; }
.tag-card-name {
  font-weight: 600;
  font-size: 14px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.tag-card-meta { font-size: 12px; color: var(--text-muted); margin-top: 1px; }

/* Круглый переключатель цвета — открывает модалку #tag-color-modal (см.
   showTagColorModal в spa-router.js), а не системный пикер напрямую: там же
   рядом с ним теперь и HEX-поле. */
.tag-card-color {
  flex: 0 0 auto;
  width: 24px;
  height: 24px;
  padding: 0;
  border: none;
  background: none;
  cursor: pointer;
}
.tag-card-swatch {
  display: block;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  border: 2px solid var(--background-accent);
  box-sizing: border-box;
  pointer-events: none;
}
.tag-card-color:hover .tag-card-swatch,
.tag-card-color:focus-visible .tag-card-swatch { border-color: var(--text-normal); }

/* === Модалка смены цвета тега === */

.tag-color-modal-preview {
  display: flex;
  align-items: center;
  gap: 12px;
}
.tag-color-modal-icon {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  font-size: 17px;
}
.tag-color-modal-name {
  font-weight: 600;
  font-size: 15px;
  color: var(--text-normal);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.tag-color-modal-picker-row {
  display: flex;
  align-items: flex-end;
  gap: 12px;
}
.tag-color-modal-picker {
  flex: 0 0 auto;
  width: 48px;
  height: 40px;
  padding: 0;
  border: 1px solid var(--background-accent);
  border-radius: 8px;
  background: none;
  cursor: pointer;
}
/* Убираем системные внутренние отступы предпросмотра цвета у input[type=color] —
   чтобы заливка занимала весь прямоугольник кнопки, без каёмки браузера по умолчанию. */
.tag-color-modal-picker::-webkit-color-swatch-wrapper { padding: 4px; }
.tag-color-modal-picker::-webkit-color-swatch { border: none; border-radius: 5px; }
.tag-color-modal-picker::-moz-color-swatch { border: none; border-radius: 5px; }

.tag-color-modal-hex-wrap { flex: 1 1 auto; min-width: 0; }
.tag-color-modal-hex { text-transform: uppercase; font-family: var(--font-mono, monospace); }
.tag-color-modal-hex.invalid { border-color: var(--red); }

.tag-color-modal-presets {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.tag-color-modal-preset {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 2px solid transparent;
  padding: 0;
  cursor: pointer;
  box-shadow: 0 0 0 1px var(--background-accent);
}
.tag-color-modal-preset:hover { transform: scale(1.08); }
.tag-color-modal-preset.active { border-color: var(--text-normal); }

.tags-no-results { grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 24px 0; font-size: 14px; }

@media (max-width: 640px) {
  .tags-toolbar { padding: 12px; gap: 10px; }
  .tags-heading { font-size: 18px; }
  .tags-search-wrap { flex: 1 1 100%; }
  .tags-toolbar-row-status { padding-top: 8px; }
}
</style>
