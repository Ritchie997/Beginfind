<!-- Вкладка "Теги": глобальный список всех тегов, существующих в системе, без
     дублей (регистр и ведущий "#" не различаются). Заменила прежнюю вкладку
     "Категории" — сущности "Категория" в проекте больше нет. Список только для
     чтения: теги создаются и правятся в самих статьях (поле "Теги" в
     редакторе или #тег прямо в тексте), см. GET /api/tags. -->
<div class="tags-page">

  <div class="tags-toolbar">
    <div class="tags-toolbar-row">
      <h2 class="tags-heading"><i class="fas fa-tags"></i> Теги</h2>
      <div class="tags-search-wrap">
        <i class="fas fa-search"></i>
        <input type="text" id="tagsSearchInput" class="tags-search-input" placeholder="Поиск">

    <div class="tags-toolbar-row tags-toolbar-row-status">
      <span class="tags-count" id="tagsCount"></span>
    </div>
  </div>

  <div class="tags-loading" id="tagsLoading">
    <div class="tags-skeleton-card"></div>
    <div class="tags-skeleton-card"></div>
    <div class="tags-skeleton-card"></div>
  </div>

  <div class="tags-empty" id="tagsEmpty" hidden>
    <i class="fas fa-tags"></i>

    <p id="tagsEmptyText">Теги появляются, когда вы добавляете их к статье в редакторе (поле «Теги») или пишете #тег прямо в тексте.</p>
  </div>

  <div class="tags-grid" id="tagsContainer" hidden></div>
</div>
